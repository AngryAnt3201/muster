<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muster arenas</title>
<style>
body{margin:0;background:#11141b;color:#e8e4da;font:14px/1.4 -apple-system,system-ui,sans-serif}
header{padding:14px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}
label{display:flex;gap:6px;align-items:center;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:0 18px 24px}
figure{margin:0;background:#1b1f29;border-radius:12px;padding:10px}
canvas{width:100%;border-radius:8px;display:block}
figcaption{margin-top:8px}
figcaption b{font-size:15px}
small{color:#9aa0ac}
.props{display:flex;gap:4px;margin-top:6px}
.app{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:0 18px 24px}
.app img{width:100%;border-radius:8px;display:block}
.props img{width:33%;background:#2a2f3b;border-radius:6px}
</style></head><body>
<header><h1>Arenas per act</h1>
<label><input type="checkbox" id="circles"> show collision circles</label>
<label><input type="checkbox" id="units" checked> sample units walking behind and in front</label>
<small>Phone-sized board (9 x 14) with the Blender backdrop and obstacle props from real levels. Props hide units behind them.</small></header>
<div class="grid" id="grid"></div>
<h2 style="font-size:16px;margin:4px 18px 10px">In the app (campaign levels 6, 24, 30, 42, iPhone size, battle and round-end assault)</h2>
<div class="app"><figure><img src="app_act1_battle.jpg"><figcaption><small>Act 1, The Old Bridge: boulders on the midline</small></figcaption></figure><figure><img src="app_act1_assault.jpg"><figcaption><small>Act 1: survivors march on the keep</small></figcaption></figure><figure><img src="app_act4_battle.jpg"><figcaption><small>Act 4, The Iron Pass: crags at the edges</small></figcaption></figure><figure><img src="app_act5_battle.jpg"><figcaption><small>Act 5, The High Keep: pillars, keep on its plaza</small></figcaption></figure><figure><img src="app_act5_assault.jpg"><figcaption><small>Act 5: assault, keep fades where units stand behind it</small></figcaption></figure><figure><img src="app_act7_assault.jpg"><figcaption><small>Act 7, The Sky Throne: ice spires, round 2 assault</small></figcaption></figure></div>
<script>
const D = {"elev":60,"world":{"x":-4,"y":-6,"w":17,"h":26},"propFrame":4.6,"W":9,"H":14,"acts":[{"act":1,"name":"Borderlands","edge":"#4a7a30","obstacle":"boulder","ground":"act1.jpg","props":[{"file":"act1_prop0.png","footprint":0.9613},{"file":"act1_prop1.png","footprint":0.9748},{"file":"act1_prop2.png","footprint":0.9703}],"anchor":[0.5,0.62],"obstacles":[{"x":0.9,"y":7,"r":0.75,"v":2},{"x":2.3,"y":7,"r":0.75,"v":0},{"x":6.7,"y":7,"r":0.75,"v":0},{"x":8.1,"y":7,"r":0.75,"v":0}],"level":"6. The Old Bridge"},{"act":2,"name":"Ash Fields","edge":"#3a3230","obstacle":"charstump","ground":"act2.jpg","props":[{"file":"act2_prop0.png","footprint":0.9928},{"file":"act2_prop1.png","footprint":0.9748},{"file":"act2_prop2.png","footprint":1.0107}],"anchor":[0.5,0.62],"obstacles":[{"x":3,"y":6.6,"r":0.55,"v":1},{"x":6,"y":7.4,"r":0.55,"v":1}],"level":"10. Cinder Road"},{"act":3,"name":"Hollow Wood","edge":"#22361f","obstacle":"stump","ground":"act3.jpg","props":[{"file":"act3_prop0.png","footprint":1.0242},{"file":"act3_prop1.png","footprint":1.0242},{"file":"act3_prop2.png","footprint":1.0242}],"anchor":[0.5,0.62],"obstacles":[{"x":1.8,"y":6.2,"r":0.5,"v":1},{"x":4.5,"y":7.2,"r":0.6,"v":2},{"x":7.2,"y":6.4,"r":0.5,"v":2},{"x":3,"y":8.4,"r":0.45,"v":1},{"x":6.2,"y":8.2,"r":0.45,"v":2}],"level":"13. Hidden Paths"},{"act":4,"name":"Iron Pass","edge":"#4f5158","obstacle":"crag","ground":"act4.jpg","props":[{"file":"act4_prop0.png","footprint":0.9748},{"file":"act4_prop1.png","footprint":0.9434},{"file":"act4_prop2.png","footprint":0.9299}],"anchor":[0.5,0.62],"obstacles":[{"x":0.9,"y":6.4,"r":0.8,"v":1},{"x":0.9,"y":7.8,"r":0.8,"v":2},{"x":8.1,"y":6.4,"r":0.8,"v":0},{"x":8.1,"y":7.8,"r":0.8,"v":0}],"level":"20. The Narrows"},{"act":5,"name":"High Keep","edge":"#5d5a54","obstacle":"pillar","ground":"act5.jpg","props":[{"file":"act5_prop0.png","footprint":1.0332},{"file":"act5_prop1.png","footprint":1.0332},{"file":"act5_prop2.png","footprint":1.0332}],"anchor":[0.5,0.62],"obstacles":[{"x":3.1,"y":7,"r":0.65,"v":0},{"x":5.9,"y":7,"r":0.65,"v":0}],"level":"30. The High Keep"},{"act":6,"name":"Frozen Reach","edge":"#9fb7cc","obstacle":"icecrystal","ground":"act6.jpg","props":[{"file":"act6_prop0.png","footprint":0.9883},{"file":"act6_prop1.png","footprint":0.9613},{"file":"act6_prop2.png","footprint":0.9658}],"anchor":[0.5,0.62],"obstacles":[{"x":1.6,"y":6.8,"r":0.55,"v":1},{"x":4.5,"y":7.2,"r":0.6,"v":2},{"x":7.4,"y":6.8,"r":0.55,"v":0}],"level":"36. The Frozen Reach"},{"act":7,"name":"Sky Throne","edge":"#7fb2ff","obstacle":"obelisk","ground":"act7.jpg","props":[{"file":"act7_prop0.png","footprint":1.0332},{"file":"act7_prop1.png","footprint":1.0332},{"file":"act7_prop2.png","footprint":1.0332}],"anchor":[0.5,0.62],"obstacles":[{"x":2.2,"y":6.6,"r":0.5,"v":2},{"x":6.8,"y":6.6,"r":0.5,"v":1},{"x":4.5,"y":7.5,"r":0.55,"v":1}],"level":"42. The Sky Throne"}]};
const grid = document.getElementById("grid");
const load = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const views = [];
for (const a of D.acts) {
  const f = document.createElement("figure");
  const c = document.createElement("canvas");
  f.appendChild(c);
  const cap = document.createElement("figcaption");
  cap.innerHTML = "<b>Act " + a.act + ": " + a.name + "</b><br><small>" + a.obstacle + " props, layout from " + a.level + "</small>";
  const strip = document.createElement("div"); strip.className = "props";
  for (const p of a.props) { const i = document.createElement("img"); i.src = p.file; i.title = "footprint " + p.footprint + " of the collision radius"; strip.appendChild(i); }
  cap.appendChild(strip);
  f.appendChild(cap);
  grid.appendChild(f);
  views.push({ a, c });
}
Promise.all(views.map(async (v) => { v.ground = await load(v.a.ground); v.props = await Promise.all(v.a.props.map((p) => load(p.file))); })).then(() => requestAnimationFrame(frame));
const stretch = 1 / Math.sin(D.elev * Math.PI / 180);
function frame(t) {
  const circles = document.getElementById("circles").checked, units = document.getElementById("units").checked;
  for (const v of views) draw(v, t / 1000, circles, units);
  requestAnimationFrame(frame);
}
function draw(v, t, circles, units) {
  const c = v.c, cw = c.clientWidth, ch = Math.round(cw * 19.5 / 9), dpr = devicePixelRatio || 1;
  if (c.width !== cw * dpr) { c.width = cw * dpr; c.height = ch * dpr; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = Math.min((cw - 16) / D.W, (ch - 120) / D.H), ox = (cw - D.W * s) / 2, oy = (ch - D.H * s) / 2;
  const sx = (x) => ox + x * s, sy = (y) => oy + y * s;
  g.fillStyle = v.a.edge; g.fillRect(0, 0, cw, ch);
  g.drawImage(v.ground, sx(D.world.x), sy(D.world.y), D.world.w * s, D.world.h * s);
  g.fillStyle = "rgba(6,10,18,0.28)"; g.beginPath(); g.rect(0, 0, cw, ch); g.rect(sx(0), sy(0), D.W * s, D.H * s); g.fill("evenodd");
  g.strokeStyle = "rgba(255,255,255,0.18)"; g.lineWidth = 1.5; g.strokeRect(sx(0), sy(0), D.W * s, D.H * s);
  const rect = (o) => { const w = D.propFrame * o.r * s, h = w * stretch; return { x: sx(o.x) - w * v.a.anchor[0], y: sy(o.y) - h * v.a.anchor[1], w, h }; };
  const obs = [...v.a.obstacles].sort((p, q) => p.y - q.y);
  for (const o of obs) { const r = rect(o); g.drawImage(v.props[o.v], r.x, r.y, r.w, r.h); }
  // sample "units": discs marching up and down the lanes past the props, painted in depth order
  const bodies = [];
  if (units) for (let i = 0; i < 6; i++) {
    const x = 0.9 + i * 1.45, y = 7 + Math.sin(t * 0.5 + i * 1.3) * 3.2;
    bodies.push({ x, y, side: i % 2 });
  }
  bodies.sort((p, q) => p.y - q.y);
  let k = 0;
  const repaint = (y) => { while (k < obs.length && obs[k].y <= y) { const o = obs[k++], r = rect(o), cx = sx(o.x), cy = sy(o.y), hw = o.r * s * 1.06; g.save(); g.beginPath(); g.rect(cx - hw, r.y, hw * 2, cy - r.y); g.clip(); g.drawImage(v.props[o.v], r.x, r.y, r.w, r.h); g.restore(); } };
  for (const b of bodies) {
    repaint(b.y);
    const x = sx(b.x), y = sy(b.y), r = 0.32 * s;
    g.fillStyle = "rgba(0,0,0,0.3)"; g.beginPath(); g.ellipse(x, y, r, r * 0.5, 0, 0, 7); g.fill();
    g.fillStyle = b.side ? "#ff6a4d" : "#3fd0c9"; g.strokeStyle = "#141016"; g.lineWidth = 2;
    g.beginPath(); g.ellipse(x, y - r * 1.1, r * 0.75, r * 1.1, 0, 0, 7); g.fill(); g.stroke();
  }
  repaint(Infinity);
  if (circles) for (const o of obs) {
    g.strokeStyle = "#ffe14d"; g.lineWidth = 2; g.setLineDash([4, 3]);
    g.beginPath(); g.arc(sx(o.x), sy(o.y), o.r * s, 0, 7); g.stroke(); g.setLineDash([]);
  }
}
</script></body></html>
