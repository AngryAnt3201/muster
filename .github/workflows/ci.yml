# Every push and pull request: types, tests, the production build, then two browsers playing a real match.
name: CI
on:
  push:
    branches: [main, production]
  pull_request:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build
  versus:
    name: Two players, one match (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start the game and the match server
        run: |
          nohup npm run play -- --no-open > play.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:5180/ > /dev/null && curl -sf http://localhost:8787/health > /dev/null && exit 0; sleep 1; done
          cat play.log; exit 1
      - run: npm run e2e:versus -- shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versus-screens
          path: |
            shots
            play.log
          if-no-files-found: ignore
          retention-days: 7
