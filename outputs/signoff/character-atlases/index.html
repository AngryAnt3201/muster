<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muster character atlases</title>
<style>
  body { margin: 0; background: #1c2430; color: #eef2f6; font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  header { padding: 14px 18px 4px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 8px; color: #b8c4d0; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 18px 10px; }
  button { background: #2c3a4c; color: #eef2f6; border: 1px solid #44566e; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.on { background: #3fd0c9; color: #0b0f18; border-color: #3fd0c9; }
  canvas { display: block; width: 100%; }
</style>
</head>
<body>
<header>
  <h1>Character atlases: tiers 1 to 4, 8 facings, live animation</h1>
  <p>Real frames from public/atlas, tinted at runtime like the game does. Rows: units. Columns: Recruit, Veteran, Elite, Ascended. Bodies turn through all 8 facings.</p>
</header>
<div class="bar" id="bar"></div>
<canvas id="c"></canvas>
<script src="data.js"></script>
<script>
const M = window.ATLAS.manifest, IMG = window.ATLAS.images;
const KINDS = Object.keys(window.ATLAS.kinds);
const ANIMS = ["idle", "walk", "attack", "death"];
let anim = "walk", team = "tide", spin = true;
const bar = document.getElementById("bar");
const btns = [];
for (const a of ANIMS) btns.push(mk(a, () => (anim = a)));
for (const t of ["tide", "ember"]) btns.push(mk(t, () => (team = t)));
btns.push(mk("turn", () => (spin = !spin)));
function mk(label, fn) { const b = document.createElement("button"); b.textContent = label; b.onclick = () => { fn(); sync(); }; bar.append(b); return b; }
function sync() { for (const b of btns) b.classList.toggle("on", b.textContent === anim || b.textContent === team || (b.textContent === "turn" && spin)); }
sync();

const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
const tinted = {};
function load(src) { return new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }
function px(img) { const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; const g = c.getContext("2d"); g.drawImage(img, 0, 0); return g.getImageData(0, 0, c.width, c.height); }
async function build(key) {
  const [ci, mi] = await Promise.all([load(IMG[key]), load(IMG[key + "_m"])]);
  const col = px(ci), mask = px(mi);
  tinted[key] = {};
  for (const t of ["tide", "ember"]) {
    const T = M.teams[t], k = [hex(T.main), hex(T.dark), hex(T.light)].map((c) => c.map((v) => (v - 1) / 255));
    const out = new ImageData(col.width, col.height), o = out.data, s = col.data, m = mask.data;
    for (let i = 0; i < s.length; i += 4) {
      if (!s[i + 3]) continue;
      for (let c = 0; c < 3; c++) o[i + c] = s[i + c] * (1 + m[i] * k[0][c] + m[i + 1] * k[1][c] + m[i + 2] * k[2][c]);
      o[i + 3] = s[i + 3];
    }
    const cv = document.createElement("canvas"); cv.width = out.width; cv.height = out.height; cv.getContext("2d").putImageData(out, 0, 0);
    tinted[key][t] = cv;
  }
}
Promise.all(Object.keys(IMG).filter((k) => !k.endsWith("_m")).map(build)).then(() => requestAnimationFrame(draw));

const cv = document.getElementById("c"), g = cv.getContext("2d");
const CELL = 150, LAB = 110, ROW = 150;
function draw(ts) {
  const t = ts / 1000, dpr = devicePixelRatio || 1;
  const W = LAB + CELL * 4, H = ROW * KINDS.length + 30;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.maxWidth = W + "px"; cv.style.height = "auto";
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#4a6042"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#eef2f6"; g.font = "600 13px system-ui";
  ["Recruit", "Veteran", "Elite", "Ascended"].forEach((n, i) => g.fillText(n, LAB + i * CELL + 10, 20));
  const dir = spin ? Math.floor(t / 1.2) % 8 : 1;
  KINDS.forEach((kind, r) => {
    const y0 = 30 + r * ROW;
    g.fillStyle = "#eef2f6"; g.fillText(window.ATLAS.kinds[kind], 10, y0 + ROW / 2);
    for (let tier = 1; tier <= 4; tier++) {
      const key = `${kind}_t${tier}`, sh = M.sheets[key];
      if (!sh || !tinted[key]) continue;
      let a = sh.anims[anim]; if (typeof a === "string") a = sh.anims[a];
      const [di, flip] = M.dir8[dir];
      const list = a[di], n = list.length;
      const loop = anim === "idle" || anim === "walk";
      const rate = anim === "walk" ? 1.6 : anim === "idle" ? 0.75 : 0.9;
      let p = (t * rate) % (loop ? 1 : 1.6); if (!loop) p = Math.min(0.999, p);
      const [x, y, w, h, ax, ay] = list[Math.min(n - 1, Math.floor(p * n))];
      const cx = LAB + (tier - 1) * CELL + CELL / 2, cy = y0 + ROW * 0.8, k = 0.62;
      const rad = M.units[kind].radius * M.ppu * k, sq = Math.sin(M.el * Math.PI / 180);
      g.fillStyle = "rgba(0,0,0,0.3)"; g.beginPath(); g.ellipse(cx, cy, rad, rad * sq, 0, 0, Math.PI * 2); g.fill();
      g.save(); g.translate(cx, cy); if (flip) g.scale(-1, 1);
      g.drawImage(tinted[key][team], x, y, w, h, -ax * k, -ay * k, w * k, h * k);
      g.restore();
    }
  });
  requestAnimationFrame(draw);
}
</script>
</body>
</html>
